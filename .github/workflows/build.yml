name: Build Android APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git \
            unzip \
            openjdk-11-jdk \
            zlib1g-dev \
            libncurses5-dev \
            libtinfo5

      - name: Install Android SDK
        run: |
          # Create Android SDK directory
          mkdir -p android-sdk

          # Download and extract command line tools to correct location
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools-linux-9477386_latest.zip
          mkdir -p android-sdk/cmdline-tools/latest
          mv cmdline-tools/* android-sdk/cmdline-tools/latest/
          rm -rf cmdline-tools commandlinetools-linux-9477386_latest.zip

          # Set environment variables
          echo "ANDROID_HOME=$(pwd)/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$(pwd)/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$(pwd)/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_ENV

      - name: Install Android packages
        run: |
          # Verify sdkmanager is accessible
          ls -la $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --list || echo "sdkmanager check failed"

          # Accept licenses (non-interactive)
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

          # Install required components (using yes pipe)
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;34.0.0"

      - name: Verify installation
        run: |
          echo "Android tools:"
          ls -la $ANDROID_SDK_ROOT/build-tools/34.0.0/
          $ANDROID_SDK_ROOT/build-tools/34.0.0/aidl --version || echo "AIDL check failed"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip wheel setuptools virtualenv
          pip install buildozer cython==0.29.33

      - name: Build APK
        run: |
      \
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 5
