name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libtinfo5 \
            libncurses5 \
            openjdk-11-jdk \
            unzip \
            ccache \
            wget

      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install Buildozer and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.19

      - name: Initialize Buildozer
        

      - name: Install Android SDK components
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses
          ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager "platform-tools" "platforms;android-34"
          ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager "build-tools;34.0.0"
          ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager "cmdline-tools;latest"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ./bin/*.apk
